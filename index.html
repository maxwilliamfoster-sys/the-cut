<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>THE CUT — a city that keeps going without you</title>
<style>
  :root{
    --bg:#0d0f14; --panel:#151922; --line:#252b38; --ink:#c9d3e3; --dim:#6b7689;
    --hot:#e05c4a; --cool:#4a9ee0; --gold:#e0b44a; --good:#5fb87a;
  }
  *{box-sizing:border-box; margin:0; padding:0}
  html,body{height:100%}
  body{
    background:var(--bg); color:var(--ink); overflow:hidden;
    font:12px/1.5 ui-monospace,"SF Mono",Menlo,Consolas,monospace;
    display:flex; flex-direction:column;
  }
  header{
    display:flex; align-items:baseline; gap:14px; flex-wrap:wrap;
    padding:8px 14px; border-bottom:1px solid var(--line); background:var(--panel);
  }
  header h1{font-size:15px; letter-spacing:3px; font-weight:700}
  header .sub{color:var(--dim)}
  header .badge{
    margin-left:auto; display:flex; gap:6px; align-items:center; color:var(--dim);
  }
  #dot{width:7px;height:7px;border-radius:50%;background:var(--good);
       box-shadow:0 0 8px var(--good); animation:pulse 2.4s infinite}
  @keyframes pulse{50%{opacity:.25}}

  main{flex:1; display:flex; min-height:0}
  #stage{flex:1; position:relative; min-width:0; background:#080a0e; overflow:hidden}
  canvas{position:absolute; left:0; top:0; image-rendering:pixelated;
         image-rendering:crisp-edges; cursor:crosshair; touch-action:none}
  #controls{
    position:absolute; left:10px; bottom:8px; pointer-events:none;
    color:var(--dim); font-size:10px; background:rgba(13,15,20,.72);
    padding:3px 8px; border-radius:3px; opacity:.75;
  }
  #controls b{color:var(--gold); font-weight:400}
  #prompt{
    position:absolute; left:50%; transform:translateX(-50%); bottom:14px;
    pointer-events:none; display:none; color:#14171d; background:var(--gold);
    padding:4px 12px; border-radius:3px; font-size:11px; font-weight:600;
  }

  #away{
    position:absolute; inset:0; display:none; z-index:5;
    background:rgba(8,10,14,.93); overflow-y:auto; padding:18px;
  }
  .a-inner{max-width:520px; margin:0 auto}
  .a-head{
    color:var(--gold); letter-spacing:3px; font-size:12px;
    padding-bottom:8px; margin-bottom:12px; border-bottom:1px solid var(--line);
  }
  .a-head span{color:var(--dim); letter-spacing:0}
  #awayBody h2{font-size:15px; color:var(--ink); margin:2px 0 8px; letter-spacing:1px}
  #awayBody .paper{
    background:#15161a; border:1px solid var(--line); border-left:2px solid var(--gold);
    padding:11px 13px; margin-bottom:14px;
  }
  #awayBody .paper b{color:var(--gold); font-weight:400}
  #awayBody .grp{margin-bottom:12px}
  #awayBody .grp h3{
    font-size:10px; letter-spacing:2px; color:var(--dim); font-weight:600; margin-bottom:5px;
  }
  #awayBody li{list-style:none; padding:2px 0 2px 10px; border-left:1px solid var(--line);
               margin-bottom:2px; color:#a8b4c8}
  #awayBody li b{color:var(--ink); font-weight:400}
  #awayGo{
    background:var(--gold); border:none; color:#14171d; font:inherit; font-weight:600;
    padding:7px 16px; border-radius:3px; cursor:pointer; margin-top:4px;
  }

  #talk{
    position:absolute; left:50%; bottom:16px; transform:translateX(-50%);
    width:min(460px, calc(100% - 24px)); display:none; flex-direction:column;
    background:rgba(13,15,20,.97); border:1px solid var(--gold); border-radius:4px;
    box-shadow:0 8px 30px rgba(0,0,0,.6);
  }
  .t-head{
    display:flex; align-items:center; padding:7px 10px; border-bottom:1px solid var(--line);
    color:var(--gold); letter-spacing:1px;
  }
  .t-head button{
    margin-left:auto; background:none; border:1px solid var(--line); color:var(--dim);
    font:inherit; font-size:10px; padding:1px 6px; border-radius:3px; cursor:pointer;
  }
  #talkLog{padding:9px 10px; max-height:180px; overflow-y:auto; display:flex;
           flex-direction:column; gap:6px}
  .tl-you{color:#9fd0ff}
  .tl-them{color:var(--ink)}
  .tl-them b{color:var(--gold); font-weight:400}
  .tl-sys{color:var(--dim); font-size:10px; font-style:italic}
  .tl-wait{color:var(--dim)}
  .tl-err{color:var(--hot); font-size:11px}
  .t-foot{display:flex; gap:6px; padding:8px 10px; border-top:1px solid var(--line)}
  .t-foot input{
    flex:1; background:#0d1017; border:1px solid var(--line); color:var(--ink);
    font:inherit; padding:5px 8px; border-radius:3px; outline:none;
  }
  .t-foot input:focus{border-color:var(--gold)}
  .t-foot button{
    background:var(--gold); border:none; color:#14171d; font:inherit; font-weight:600;
    padding:5px 12px; border-radius:3px; cursor:pointer;
  }

  aside{
    width:310px; flex-shrink:0; border-left:1px solid var(--line); background:var(--panel);
    overflow-y:auto; padding:12px;
  }
  aside::-webkit-scrollbar{width:8px}
  aside::-webkit-scrollbar-thumb{background:var(--line)}

  .sec{margin-bottom:16px}
  .sec h2{
    font-size:10px; letter-spacing:2px; color:var(--dim); font-weight:600;
    padding-bottom:5px; margin-bottom:8px; border-bottom:1px solid var(--line);
  }
  .row{display:flex; justify-content:space-between; gap:8px; padding:1px 0}
  .row span:last-child{color:var(--dim)}

  .bar{height:5px; background:#0d1017; border-radius:3px; overflow:hidden; margin:3px 0 7px}
  .bar i{display:block; height:100%; transition:width .5s}

  .event{
    border-left:2px solid var(--gold); padding:6px 9px; background:#1b1f2a;
    color:#e6dcc4; font-style:italic;
  }
  .quiet{border-left-color:var(--line); color:var(--dim); font-style:normal}

  .who{
    display:flex; align-items:center; gap:8px; padding:4px 6px; border-radius:3px;
    cursor:pointer; border:1px solid transparent;
  }
  .who:hover{background:#1b202b}
  .who.on{background:#1e2533; border-color:var(--line)}
  .who canvas{position:static; width:20px; height:28px}
  .who .n{flex:1; min-width:0; overflow:hidden; text-overflow:ellipsis; white-space:nowrap}
  .who .w{color:var(--dim); font-size:10px}

  .thought{color:#9aa8bf; font-style:italic; padding:6px 0}
  .memo{padding:5px 0; border-bottom:1px dashed var(--line); color:#a8b4c8}
  .memo b{color:var(--gold); font-weight:400}
  .rel{display:flex; justify-content:space-between; gap:6px; padding:3px 0}
  .rel .o{color:var(--dim); font-size:10px; flex:1; text-align:right}

  footer{
    border-top:1px solid var(--line); background:var(--panel); padding:6px 14px;
    color:var(--dim); white-space:nowrap; overflow:hidden; text-overflow:ellipsis;
  }

  /* A 310px sidebar next to a 64-tile-wide city leaves the map unreadable on anything
     narrow — on a phone the sprites came out under a pixel each. Below this width the
     map takes the full width and the panel moves underneath it. */
  @media (max-width: 820px){
    main{flex-direction:column}
    #stage{flex:0 0 58vh; min-height:240px}
    aside{width:100%; border-left:none; border-top:1px solid var(--line); flex:1}
  }
  .err{color:var(--hot); padding:10px}
  .hint{color:var(--dim); font-size:10px; padding-top:6px}

  /* One trouble = one sentence you can read at a glance, with a severity dot. The old
     panel showed "$4,200 · 12d over" and left you to work out that it mattered. */
  .tag{font-size:10px; color:var(--dim); font-weight:400}
  .tr{display:flex; gap:7px; align-items:flex-start; padding:4px 0;
      border-bottom:1px solid rgba(255,255,255,.04); line-height:1.35}
  .tr:last-child{border-bottom:0}
  .tr b{font-weight:600}
  .pip{width:7px; height:7px; border-radius:50%; margin-top:5px; flex-shrink:0}
  .p3{background:var(--hot)} .p2{background:var(--gold)} .p1{background:var(--dim)}
  .tr .sub{color:var(--dim); font-size:10px; display:block; margin-top:1px}
  .calm{color:var(--dim); font-size:11px; padding:4px 0}
</style>
</head>
<body>

<header>
  <h1>THE CUT</h1>
  <span class="sub" id="when">—</span>
  <span class="sub" id="weather"></span>
  <span class="badge"><span id="dot"></span><span id="live">connecting</span></span>
</header>

<main>
  <div id="stage">
    <canvas id="cv"></canvas>
    <div id="away">
      <div class="a-inner">
        <div class="a-head">WHILE YOU WERE AWAY <span id="awaySub"></span></div>
        <div id="awayBody"></div>
        <button id="awayGo">back to the block</button>
      </div>
    </div>
    <div id="controls">scroll to zoom · drag to pan · click anyone · <b>WASD to walk in</b></div>
    <div id="prompt"></div>
    <div id="talk">
      <div class="t-head"><span id="talkWho">—</span><button id="talkX">esc</button></div>
      <div id="talkLog"></div>
      <div class="t-foot">
        <input id="talkInput" maxlength="180" placeholder="say something…" autocomplete="off">
        <button id="talkSend">say</button>
      </div>
    </div>
  </div>
  <aside>
    <!-- Four sections, not seven. The panel used to be a dashboard of numbers — heat bars,
         a debt ledger, separate boxes for laws, ruins and the dead — which is a lot to read
         and tells you very little about what is actually going on. Now: what just happened,
         what is going wrong, the state of the place, and the people. Everything is a
         sentence rather than a row of figures. -->
    <div class="sec">
      <h2>RIGHT NOW</h2>
      <div id="latest" class="event quiet">Nothing yet.</div>
      <div id="mood" class="hint"></div>
    </div>
    <div class="sec">
      <h2>TROUBLE <span id="troublecount" class="tag"></span></h2>
      <div id="trouble"></div>
    </div>
    <div class="sec">
      <h2>THE STATE OF THE BLOCK</h2>
      <div id="stateblock"></div>
    </div>
    <div class="sec">
      <h2 id="lawhead">THE LAW HERE</h2>
      <div id="laws"></div>
    </div>
    <div class="sec">
      <h2 id="casthead">THE CAST</h2>
      <div id="cast"></div>
      <div class="hint">Click anyone — on the map or here.</div>
    </div>
    <div class="sec" id="mindsec" style="display:none">
      <h2 id="mindname">—</h2>
      <div id="mind"></div>
    </div>
  </aside>
</main>

<footer id="ticker">Loading the city…</footer>

<script>
'use strict';

// ── palettes ────────────────────────────────────────────────────────────────
// Authored rather than hashed from the id: twelve people need to be tellable apart at
// 14 pixels tall, and a hash cheerfully hands two of them the same brown coat.
const SKIN = {a:'#8d5524', b:'#c68642', c:'#e0ac69', d:'#f1c27d', e:'#5c3317'};
const P = {
  dez:    {sk:SKIN.a, hair:'#1a1a1a', top:'#2f4858', leg:'#1e232b'},
  malik:  {sk:SKIN.b, hair:'#2b1d16', top:'#c8452f', leg:'#243040'},
  ruiz:   {sk:SKIN.c, hair:'#3b2418', top:'#38506b', leg:'#20252e'},
  kohl:   {sk:SKIN.d, hair:'#a8762f', top:'#2a3b57', leg:'#20252e'},
  ivy:    {sk:SKIN.a, hair:'#d8d8d8', top:'#6b4a7a', leg:'#33383f'},
  tee:    {sk:SKIN.e, hair:'#141414', top:'#e0b44a', leg:'#2c3138'},
  simone: {sk:SKIN.a, hair:'#241a14', top:'#3f8f7a', leg:'#2a2f36'},
  rey:    {sk:SKIN.b, hair:'#3a2a1c', top:'#5b6a4a', leg:'#3a3125'},
  nadia:  {sk:SKIN.c, hair:'#1d1410', top:'#b8546e', leg:'#2b3a52'},
  booker: {sk:SKIN.e, hair:'#5a5a5a', top:'#7a5c34', leg:'#2e2a24'},
  junie:  {sk:SKIN.d, hair:'#c26b3a', top:'#d9d2c4', leg:'#3c4450'},
  cass:   {sk:SKIN.d, hair:'#8a8578', top:'#20242b', leg:'#20242b'},
};
const FALLBACK = {sk:SKIN.c, hair:'#333', top:'#888', leg:'#444'};
// Deliberately the only cold blue in the palette — you should be findable at a glance.
P.__player = {sk:SKIN.d, hair:'#2a2622', top:'#2f7fb8', leg:'#232a33'};

const TILECOL = {
  '.':'#4a505c',   // pavement
  ',':'#26292f',   // road
  ':':'#26292f',   // road with centre line
  '=':'#2c3037',   // crossing
  'g':'#3d4a3a',   // grass
  '#':'#4a4038',   // wall (overridden per building style)
  'f':'#5a5348',   // interior floor
  'D':'#c8a04a',   // door
  '~':'#1b3a4a',
  'x':'#3a352f',   // rubble — what is left after a fire
  's':'#6b5c3a',   // scaffolding — a building coming back
};

// Every building drew in the same brown, so a street of six shops read as one repeated
// asset. Each style changes wall, trim, window and roof together — shared palette, clearly
// different buildings.
const STYLE = {
  brick:      {wall:'#6d3a30', trim:'#8a4a3c', win:'#242a34', roof:'#48261f', tex:'brick'},
  brownstone: {wall:'#7a5a3c', trim:'#95704c', win:'#282730', roof:'#4f3826', tex:'brick'},
  concrete:   {wall:'#666c73', trim:'#828890', win:'#29303a', roof:'#494e55', tex:'panel'},
  clapboard:  {wall:'#7f8a76', trim:'#9aa691', win:'#2a2e36', roof:'#5a4736', tex:'plank'},
  metal:      {wall:'#565c65', trim:'#6f7883', win:'#20242a', roof:'#3c4147', tex:'ribs'},
  stone:      {wall:'#87826f', trim:'#a09a86', win:'#282a2e', roof:'#5c584c', tex:'block'},
  shopfront:  {wall:'#5c4759', trim:'#7b6076', win:'#1d2731', roof:'#3d2f3e', tex:'panel',
               awning:true},
  none:       {wall:'#4a4038', trim:'#5a5048', win:'#2a2a2a', roof:'#3a332c', tex:'panel'},
};

const AWNING = ['#b4483c','#3c7a6a','#c08a3a','#4a6aa8','#8a5aa8','#c26a4a'];

const PROP = {
  bed:     (g,x,y)=>{ g.fillStyle='#6a5a72'; g.fillRect(x+1,y+2,14,12);
                      g.fillStyle='#d8d4cc'; g.fillRect(x+2,y+3,12,4);
                      g.fillStyle='#4a3f52'; g.fillRect(x+1,y+12,14,2); },
  sofa:    (g,x,y)=>{ g.fillStyle='#4f6a5c'; g.fillRect(x+1,y+4,14,9);
                      g.fillStyle='#5f7d6c'; g.fillRect(x+2,y+6,12,5);
                      g.fillStyle='#3e564a'; g.fillRect(x+1,y+11,14,2); },
  tv:      (g,x,y)=>{ g.fillStyle='#1a1d22'; g.fillRect(x+2,y+4,12,9);
                      g.fillStyle='#7fc4e0'; g.fillRect(x+3,y+5,10,6);
                      g.fillStyle='#0f1216'; g.fillRect(x+6,y+13,4,2); },
  table:   (g,x,y)=>{ g.fillStyle='#7a5636'; g.fillRect(x+2,y+4,12,8);
                      g.fillStyle='#8f6743'; g.fillRect(x+3,y+5,10,3); },
  chair:   (g,x,y)=>{ g.fillStyle='#6b4c30'; g.fillRect(x+5,y+5,6,7);
                      g.fillStyle='#7d5b3a'; g.fillRect(x+5,y+4,6,2); },
  sink:    (g,x,y)=>{ g.fillStyle='#8f969c'; g.fillRect(x+2,y+4,12,8);
                      g.fillStyle='#5d6a74'; g.fillRect(x+4,y+6,8,4); },
  counter: (g,x,y)=>{ g.fillStyle='#6a4f38'; g.fillRect(x,y+4,16,8);
                      g.fillStyle='#8a6a4c'; g.fillRect(x,y+4,16,2); },
  till:    (g,x,y)=>{ g.fillStyle='#3a3f46'; g.fillRect(x+3,y+4,10,8);
                      g.fillStyle='#c8b46a'; g.fillRect(x+5,y+6,6,3); },
  shelf:   (g,x,y)=>{ g.fillStyle='#5a4632'; g.fillRect(x+1,y+2,14,12);
                      g.fillStyle='#8a7a5a'; for(let i=0;i<3;i++) g.fillRect(x+2,y+4+i*4,12,2); },
  desk:    (g,x,y)=>{ g.fillStyle='#5d5044'; g.fillRect(x+1,y+4,14,9);
                      g.fillStyle='#2a2e34'; g.fillRect(x+9,y+5,5,4); },
  crate:   (g,x,y)=>{ g.fillStyle='#79572f'; g.fillRect(x+2,y+3,12,11);
                      g.fillStyle='#94703f'; g.fillRect(x+2,y+7,12,2); g.fillRect(x+7,y+3,2,11); },
  machine: (g,x,y)=>{ g.fillStyle='#4c525a'; g.fillRect(x+1,y+2,14,12);
                      g.fillStyle='#c0703a'; g.fillRect(x+3,y+4,4,4);
                      g.fillStyle='#2d3238'; g.fillRect(x+8,y+5,5,7); },
  bench:   (g,x,y)=>{ g.fillStyle='#6d5334'; g.fillRect(x,y+6,16,4);
                      g.fillStyle='#4e3b25'; g.fillRect(x+1,y+10,2,3); g.fillRect(x+13,y+10,2,3); },
  bin:     (g,x,y)=>{ g.fillStyle='#3c4750'; g.fillRect(x+4,y+4,8,10);
                      g.fillStyle='#55636e'; g.fillRect(x+3,y+3,10,2); },
  tree:    (g,x,y)=>{ g.fillStyle='#4a3524'; g.fillRect(x+7,y+9,2,6);
                      g.fillStyle='#3f6b3a'; g.beginPath(); g.arc(x+8,y+7,6,0,7); g.fill();
                      g.fillStyle='#4d7f45'; g.beginPath(); g.arc(x+6,y+6,3,0,7); g.fill(); },
  plant:   (g,x,y)=>{ g.fillStyle='#7a5236'; g.fillRect(x+5,y+10,6,4);
                      g.fillStyle='#4d7f45'; g.beginPath(); g.arc(x+8,y+7,4,0,7); g.fill(); },
  rug:     (g,x,y)=>{ g.fillStyle='#7a4448'; g.fillRect(x,y+2,16,12);
                      g.fillStyle='#96595c'; g.fillRect(x+2,y+4,12,8); },
};

// ── state ───────────────────────────────────────────────────────────────────
// The dialogue proxy. It holds the Groq key and the write path into the city's memory;
// the browser holds neither, which is why this is a URL and not an API key.
const TALK_URL = 'https://the-cut-talk.maxwilliamfoster.workers.dev';

let MAP=null, WORLD=null, AGENTS=null, LOG=[];
// ROSTER is everybody ever; AGENTS is only the living, which is what gets drawn.
let ROSTER=null, DEAD=[];
let selected=null, bg=null, T=16, lastFetch=0, beatStartMs=0;
const anim = {};                 // per-agent render state
const cv = document.getElementById('cv'), ctx = cv.getContext('2d');
ctx.imageSmoothingEnabled = false;

const BEAT_MS = 15*60*1000;
const WALK_TPS = 3.5;            // tiles per second while walking a path

const $ = id => document.getElementById(id);
const clamp=(v,a,b)=>Math.max(a,Math.min(b,v));
const esc = s => String(s??'').replace(/[<>&]/g,c=>({'<':'&lt;','>':'&gt;','&':'&amp;'}[c]));

// ── loading ─────────────────────────────────────────────────────────────────
async function jget(path){
  const r = await fetch(path + '?t=' + Date.now(), {cache:'no-store'});
  if(!r.ok) throw new Error(path + ' ' + r.status);
  return r.json();
}

async function load(first){
  try{
    // The map used to be fetched once, because it could never change. Buildings now burn
    // down, get rebuilt and go up on empty land, so the shape is re-checked every poll —
    // but the background canvas is only redrawn when `version` says something moved.
    const m = await jget('state/map.json');
    const shapeChanged = MAP && MAP.version !== m.version;
    MAP = m; T = MAP.tile;
    const [w,a] = await Promise.all([jget('state/world.json'), jget('state/agents.json')]);
    const newBeat = !WORLD || w.beat !== WORLD.beat;
    WORLD = w;
    // People can die now. Splitting them out here rather than at each use means every
    // render loop, hit-test and cast list excludes them without having to remember to —
    // a corpse that still walks to work is a worse bug than one that renders oddly.
    ROSTER = a;
    AGENTS = {};
    DEAD = [];
    for(const id in a){
      if(a[id].alive === false) DEAD.push(a[id]); else AGENTS[id] = a[id];
    }
    DEAD.sort((p,q)=>(q.died_day||0)-(p.died_day||0));

    try{
      const day = Math.floor(w.beat/4), wk = String(Math.floor(day/7)).padStart(3,'0');
      const txt = await (await fetch(`state/log-w${wk}.jsonl?t=${Date.now()}`,{cache:'no-store'})).text();
      LOG = txt.trim().split('\n').filter(Boolean).map(JSON.parse);
    }catch(e){ LOG = []; }

    if(first || shapeChanged) buildBackground();
    if(first) fitCanvas();
    if(newBeat) onNewBeat();
    paintPanel();
    draw();
    if(first) showAway();
    $('live').textContent = 'live';
    $('dot').style.background = 'var(--good)';
    lastFetch = Date.now();
  }catch(e){
    $('live').textContent = 'offline';
    $('dot').style.background = 'var(--hot)';
    if(first) document.getElementById('stage').innerHTML =
      `<div class="err">Could not load the city.<br><br>${esc(e.message)}<br><br>`+
      `Serve this folder over HTTP — <code>py -m http.server</code> — rather than opening the file directly.</div>`;
  }
}

// ── static map, drawn once ──────────────────────────────────────────────────
function buildBackground(){
  bg = document.createElement('canvas');
  bg.width = MAP.w*T; bg.height = MAP.h*T;
  const g = bg.getContext('2d');
  g.imageSmoothingEnabled = false;

  // Which building (if any) owns each tile, so walls can be painted in that building's
  // own style rather than one shared brown.
  const owner = {};
  for(const id in MAP.locations){
    const L = MAP.locations[id];
    // rects, not rect: the bounding box of an L-shaped building covers the street beside
    // it and a U-shaped one covers its own courtyard, so both would be painted as wall.
    for(const [bx,by,bw,bh] of (L.rects || [L.rect])){
      for(let y=by;y<by+bh;y++) for(let x=bx;x<bx+bw;x++) owner[x+','+y] = id;
    }
  }

  for(let y=0;y<MAP.h;y++){
    const row = MAP.grid[y];
    for(let x=0;x<MAP.w;x++){
      const c = row[x];
      const L = MAP.locations[owner[x+','+y]];
      const S = L ? (STYLE[L.style] || STYLE.none) : STYLE.none;

      g.fillStyle = (c==='#') ? S.wall : (TILECOL[c] || '#000');
      g.fillRect(x*T,y*T,T,T);

      // A flat fill at this scale reads as graph paper, so every tile type gets one
      // cheap detail pass. This is the whole difference between "tilemap" and "place".
      if(c==='.'){                                   // pavement: slabs, occasional stain
        g.fillStyle='rgba(0,0,0,.18)';  g.fillRect(x*T,y*T,T,1); g.fillRect(x*T,y*T,1,T);
        g.fillStyle='rgba(255,255,255,.05)'; g.fillRect(x*T+1,y*T+1,T-2,1);
        if((x*7+y*13)%17===0){ g.fillStyle='rgba(0,0,0,.13)'; g.fillRect(x*T+4,y*T+6,5,3); }
      } else if(c===','){                            // asphalt: subtle grain
        if((x*5+y*11)%7===0){ g.fillStyle='rgba(255,255,255,.028)'; g.fillRect(x*T+3,y*T+4,6,3); }
      } else if(c===':'){                            // dashed centre line
        g.fillStyle='#c9b46a';
        g.fillRect(x*T+T/2-1, y*T+2, 2, T-4);
      } else if(c==='='){                            // zebra crossing
        g.fillStyle='#c8ccd2';
        for(let i=1;i<T;i+=6) g.fillRect(x*T+i, y*T+2, 3, T-4);
      } else if(c==='~'){                            // water: slow chop
        g.fillStyle='rgba(255,255,255,.06)';
        if((x*3+y*5)%4===0) g.fillRect(x*T+2,y*T+5,7,1);
        if((x*7+y*3)%6===0) g.fillRect(x*T+8,y*T+11,5,1);
        g.fillStyle='rgba(0,0,0,.12)'; g.fillRect(x*T,y*T+T-2,T,2);
      } else if(c==='g'){                            // grass: tufts
        if((x*3+y*7)%5===0){ g.fillStyle='rgba(140,180,120,.16)'; g.fillRect(x*T+5,y*T+6,3,4); }
        if((x*11+y*5)%9===0){ g.fillStyle='rgba(90,120,80,.25)'; g.fillRect(x*T+9,y*T+9,3,3); }
      } else if(c==='x'){                            // rubble: broken masonry, scorching
        g.fillStyle='rgba(0,0,0,.35)';
        if((x*5+y*7)%3===0) g.fillRect(x*T+2,y*T+3,4,3);
        if((x*11+y*3)%4===0) g.fillRect(x*T+9,y*T+8,4,4);
        g.fillStyle='rgba(150,140,125,.22)';
        if((x*7+y*13)%5===0) g.fillRect(x*T+5,y*T+10,5,2);
        if((x*3+y*11)%6===0) g.fillRect(x*T+10,y*T+2,3,3);
        g.fillStyle='rgba(20,15,12,.30)'; g.fillRect(x*T,y*T+T-2,T,2);
      } else if(c==='s'){                            // scaffolding: poles and boards
        g.fillStyle='rgba(0,0,0,.30)'; g.fillRect(x*T,y*T,T,T);
        g.fillStyle='#8a7440';
        g.fillRect(x*T+2,y*T,2,T); g.fillRect(x*T+T-4,y*T,2,T);
        g.fillStyle='#a08a52'; g.fillRect(x*T,y*T+4,T,2); g.fillRect(x*T,y*T+11,T,2);
        g.fillStyle='rgba(210,190,140,.18)'; g.fillRect(x*T,y*T,T,1);
      } else if(c==='#'){
        g.fillStyle='rgba(0,0,0,.30)';
        g.fillRect(x*T,y*T+T-3,T,3); g.fillRect(x*T+T-3,y*T,3,T);
        g.fillStyle = S.trim; g.fillRect(x*T,y*T,T,2);
        if(S.tex==='brick'){
          g.fillStyle='rgba(0,0,0,.16)';
          for(let r=0;r<T;r+=5){ g.fillRect(x*T,y*T+r,T,1);
            g.fillRect(x*T + ((r/5)%2?4:11), y*T+r, 1, 5); }
        } else if(S.tex==='plank'){
          g.fillStyle='rgba(0,0,0,.14)';
          for(let r=0;r<T;r+=4) g.fillRect(x*T,y*T+r,T,1);
        } else if(S.tex==='ribs'){
          g.fillStyle='rgba(0,0,0,.18)';
          for(let cx=0;cx<T;cx+=4) g.fillRect(x*T+cx,y*T,1,T);
        } else if(S.tex==='block'){
          g.fillStyle='rgba(0,0,0,.14)';
          for(let r=0;r<T;r+=8){ g.fillRect(x*T,y*T+r,T,1); }
          g.fillRect(x*T+8,y*T,1,T);
        } else {
          g.fillStyle='rgba(0,0,0,.10)'; g.fillRect(x*T,y*T+8,T,1);
        }
      } else if(c==='f'){
        const warm = L && (L.kind==='home' || L.kind==='social');
        g.fillStyle = warm ? 'rgba(150,110,70,.16)' : 'rgba(0,0,0,.10)';
        if((x+y)%2===0) g.fillRect(x*T,y*T,T,T);
      } else if(c==='D'){
        g.fillStyle='rgba(0,0,0,.40)'; g.fillRect(x*T+2,y*T+1,T-4,T-1);
        g.fillStyle='#e8c874'; g.fillRect(x*T+T-6,y*T+T/2,2,2);
      }
    }
  }

  // Per-building dressing: windows on the street face, awnings on shopfronts, a roof lip,
  // then the furniture, then a name plate.
  let awn = 0;
  for(const id in MAP.locations){
    const L = MAP.locations[id], [x,y,w,h] = L.rect;
    const S = STYLE[L.style] || STYLE.none;
    if(L.kind === 'outdoor'){ /* open sites get no facade */ }
    else {
      const front = (y+h-1)*T;                    // south wall faces the street
      if(S.awning){
        const col = AWNING[awn++ % AWNING.length];
        for(let wx=x+1; wx<x+w-1; wx++){
          g.fillStyle = ((wx-x)%2 ? col : '#e8e2d6');
          g.fillRect(wx*T, front-4, T, 5);
        }
        g.fillStyle='rgba(0,0,0,.30)'; g.fillRect((x+1)*T, front+1, (w-2)*T, 2);
        // big glass either side of the door
        for(let wx=x+1; wx<x+w-1; wx++){
          if(Math.abs(wx - (x+Math.floor(w/2))) < 1) continue;
          g.fillStyle=S.win; g.fillRect(wx*T+1, front+3, T-2, 8);
          g.fillStyle='rgba(200,220,240,.16)'; g.fillRect(wx*T+2, front+4, T-4, 3);
        }
      } else {
        for(let wx=x+2; wx<x+w-2; wx+=3){
          if(Math.abs(wx - (x+Math.floor(w/2))) < 1) continue;
          g.fillStyle=S.win;  g.fillRect(wx*T+3, front+3, T-6, 9);
          g.fillStyle=S.trim; g.fillRect(wx*T+2, front+2, T-4, 1);
          g.fillStyle='rgba(224,180,74,.22)'; g.fillRect(wx*T+4, front+4, T-8, 4);
        }
      }
      // upper-floor windows along the back wall, and a roof lip
      for(let wx=x+2; wx<x+w-2; wx+=3){
        g.fillStyle=S.win; g.fillRect(wx*T+3, y*T+4, T-6, 7);
      }
      g.fillStyle = S.roof; g.fillRect(x*T, y*T-3, w*T, 3);
      g.fillStyle = 'rgba(0,0,0,.25)'; g.fillRect(x*T, y*T-1, w*T, 1);
    }

    for(const f of (L.furniture||[])){
      const fn = PROP[f.type];
      if(fn) fn(g, f.x*T, f.y*T);
    }

  }
  // Building names are deliberately NOT drawn here. This canvas is scaled by the camera
  // with smoothing off, so any text baked into it gets stretched into pixel mush. They are
  // drawn in screen space in drawLabels() instead, at native resolution, so they stay
  // crisp at every zoom level.
}

function drawLabels(){
  // Screen space: no camera transform, so the text renders at device resolution.
  ctx.save();
  ctx.setTransform(1, 0, 0, 1, 0, 0);
  ctx.imageSmoothingEnabled = true;
  ctx.textAlign = 'center';
  ctx.textBaseline = 'middle';

  const size = Math.max(9, Math.min(13, 10 * Math.sqrt(view.s)));
  ctx.font = `600 ${size}px ui-sans-serif, -apple-system, "Segoe UI", system-ui, sans-serif`;

  for(const id in MAP.locations){
    const L = MAP.locations[id], [x,y,w,h] = L.rect;
    const sx = (x + w/2)*T*view.s + view.ox;
    const sy = (y + h)*T*view.s + view.oy + size*0.9;
    if(sx < -160 || sx > cv.width + 160 || sy < -20 || sy > cv.height + 20) continue;

    const tw = ctx.measureText(L.name).width;
    ctx.fillStyle = 'rgba(8,10,14,.82)';
    ctx.beginPath();
    const bx = sx - tw/2 - 6, by = sy - size*0.78, bw = tw + 12, bh = size*1.56;
    if(ctx.roundRect) ctx.roundRect(bx, by, bw, bh, 3); else ctx.rect(bx, by, bw, bh);
    ctx.fill();
    ctx.strokeStyle = 'rgba(255,255,255,.07)'; ctx.lineWidth = 1; ctx.stroke();

    ctx.fillStyle = '#d3dbe8';
    ctx.fillText(L.name, sx, sy);
  }
  ctx.restore();
  ctx.imageSmoothingEnabled = false;
}

// ── sprites ─────────────────────────────────────────────────────────────────
// 10x14 chunky figures drawn with fillRect. No asset pack, no loading, no licence file,
// and the palette is guaranteed to stay consistent across every frame and every reload.
function drawPerson(g, px, py, id, frame, facing, scale){
  const p = P[id] || FALLBACK, s = scale || 1;
  const R = (x,y,w,h,c)=>{ g.fillStyle=c; g.fillRect(px+x*s, py+y*s, w*s, h*s); };

  R(2,13,6,1,'rgba(0,0,0,.30)');                       // shadow
  const step = frame % 2;
  R(3, 10, 2, 3, p.leg);                               // legs
  R(5, 10, 2, 3, p.leg);
  if(step){ R(3,12,2,1,'rgba(0,0,0,.35)'); } else { R(5,12,2,1,'rgba(0,0,0,.35)'); }
  R(2, 5, 6, 5, p.top);                                // torso
  R(1, 6, 1, 3, p.top); R(8, 6, 1, 3, p.top);          // arms
  R(2, 1, 6, 5, p.sk);                                 // head
  R(2, 0, 6, 2, p.hair);                               // hair
  if(facing === 'W'){ R(1,1,1,4,p.hair); } else if(facing === 'E'){ R(8,1,1,4,p.hair); }
  if(facing !== 'N'){                                  // eyes, hidden when facing away
    R(3, 3, 1, 1, '#11141a'); R(6, 3, 1, 1, '#11141a');
  }
}

function castThumb(id){
  const c = document.createElement('canvas');
  c.width=10; c.height=14;
  const g=c.getContext('2d'); g.imageSmoothingEnabled=false;
  drawPerson(g,0,0,id,0,'S',1);
  return c;
}

// ── animation ───────────────────────────────────────────────────────────────
function onNewBeat(){
  beatStartMs = Date.now();
  // If the tab was opened mid-beat, skip the walk forward by however much of it has
  // already happened in the real world, so nobody teleports or re-walks a path they
  // finished twelve minutes ago.
  const elapsed = (Date.now() - Date.parse(WORLD.last_beat_at));
  for(const id in AGENTS){
    const a = AGENTS[id];
    const path = (a.path && a.path.length > 1) ? a.path : [a.pos];
    anim[id] = {
      path, t: clamp(elapsed/1000, 0, 1e6), facing:'S',
      wander:[0,0], nextWander: Math.random()*4000,
    };
  }
  renderTicker();
}

function agentRenderPos(id, nowMs){
  const st = anim[id];
  if(!st) return {x:AGENTS[id].pos[0], y:AGENTS[id].pos[1], moving:false, facing:'S'};

  const dur = (st.path.length-1) / WALK_TPS;
  const t = (nowMs - beatStartMs)/1000 + st.t;

  if(t < dur && st.path.length > 1){
    const f = (t/dur) * (st.path.length-1);
    const i = Math.floor(f), frac = f-i;
    const a = st.path[Math.min(i, st.path.length-1)];
    const b = st.path[Math.min(i+1, st.path.length-1)];
    const dx = b[0]-a[0], dy = b[1]-a[1];
    let facing = st.facing;
    if(dx>0) facing='E'; else if(dx<0) facing='W';
    else if(dy>0) facing='S'; else if(dy<0) facing='N';
    st.facing = facing;
    return {x:a[0]+dx*frac, y:a[1]+dy*frac, moving:true, facing};
  }

  // Arrived: drift a little so a stationary crowd still looks inhabited.
  if(nowMs > st.nextWander){
    st.nextWander = nowMs + 2500 + Math.random()*5000;
    const p = AGENTS[id].pos;
    const nx = p[0] + (Math.random()*2-1), ny = p[1] + (Math.random()*2-1);
    if(walkableAt(Math.round(nx), Math.round(ny))) st.wander = [nx-p[0], ny-p[1]];
  }
  const p = AGENTS[id].pos;
  const w = st.wander;
  const bob = Math.sin(nowMs/600 + id.length) * 0.04;
  return {x:p[0]+w[0]*0.5, y:p[1]+w[1]*0.5+bob, moving:false, facing:st.facing};
}

// Must stay in step with city.py's WALKABLE — a tile type added there and forgotten here
// becomes an invisible wall the player cannot cross but everyone else walks straight over.
// Must stay in step with city.WALKABLE in sim/city.py. Rubble is walkable (people
// stand in the shell of a burnt building); scaffolding is not.
const WALKABLE_TILES = '.,:=gfDx';
function walkableAt(x,y){
  if(!MAP || y<0 || y>=MAP.h || x<0 || x>=MAP.w) return false;
  return WALKABLE_TILES.includes(MAP.grid[y][x]);
}

// ── camera + draw ───────────────────────────────────────────────────────────
let view = {s:1, ox:0, oy:0};
let fitS = 1, zoom = 1, pan = {x:0, y:0};

function applyView(){
  view.s = fitS * zoom;
  // Walking in switches the camera from "look at the city" to "be in it": zoom to where a
  // face is legible and lock on, rather than leaving you a two-pixel speck on a map.
  if(follow && PLAYER.spawned){
    view.s = Math.max(view.s, 2.2);
    view.ox = cv.width/2  - PLAYER.x*T*view.s;
    view.oy = cv.height/2 - PLAYER.y*T*view.s;
    return;
  }
  const mw = MAP.w*T*view.s, mh = MAP.h*T*view.s;
  // Keep the city on screen: pan is only allowed along an axis that actually overflows.
  const slackX = Math.max(0, (mw - cv.width)/2), slackY = Math.max(0, (mh - cv.height)/2);
  pan.x = clamp(pan.x, -slackX, slackX);
  pan.y = clamp(pan.y, -slackY, slackY);
  view.ox = (cv.width - mw)/2 + pan.x;
  view.oy = (cv.height - mh)/2 + pan.y;
}

function fitCanvas(){
  const st = document.getElementById('stage');
  cv.width = st.clientWidth; cv.height = st.clientHeight;
  ctx.imageSmoothingEnabled = false;
  // Fit the whole city rather than forcing scale >= 1 — clamping to 1 clipped ~27px off
  // every edge on a typical pane, which quietly hid the docks and the underpass.
  fitS = Math.min(cv.width/(MAP.w*T), cv.height/(MAP.h*T));
  applyView();
}

// Fitting a 64-tile-wide city into a narrow pane puts the sprites below a pixel each, so
// zoom is not a nicety here — without it the whole thing is unreadable on a phone.
cv.addEventListener('wheel', e=>{
  e.preventDefault();
  if(!MAP) return;
  const r = cv.getBoundingClientRect();
  const mx = e.clientX - r.left, my = e.clientY - r.top;
  const wx = (mx - view.ox)/view.s, wy = (my - view.oy)/view.s;   // world point under cursor
  zoom = clamp(zoom * (e.deltaY < 0 ? 1.2 : 1/1.2), 1, 8);
  applyView();
  pan.x += mx - (wx*view.s + view.ox);                            // keep it under the cursor
  pan.y += my - (wy*view.s + view.oy);
  applyView(); draw();
}, {passive:false});

let drag = null;
cv.addEventListener('pointerdown', e=>{
  drag = {x:e.clientX, y:e.clientY, px:pan.x, py:pan.y, moved:0};
  cv.setPointerCapture(e.pointerId);
});
cv.addEventListener('pointermove', e=>{
  if(!drag) return;
  const dx = e.clientX - drag.x, dy = e.clientY - drag.y;
  drag.moved = Math.max(drag.moved, Math.hypot(dx, dy));
  pan.x = drag.px + dx; pan.y = drag.py + dy;
  applyView(); draw();
});
cv.addEventListener('pointerup', ()=>{ setTimeout(()=>{ drag = null; }, 0); });
cv.addEventListener('dblclick', ()=>{ zoom = 1; pan = {x:0,y:0}; applyView(); draw(); });
window.addEventListener('resize', ()=>{ if(MAP) fitCanvas(); });
// A tab that loads while hidden (background tab, collapsed pane) reports clientWidth 0,
// which leaves a 0x0 canvas that a window resize alone may never fix. Observing the stage
// means the map appears the moment the element actually has a size.
new ResizeObserver(()=>{ if(MAP){ fitCanvas(); draw(); } }).observe(document.getElementById('stage'));

function frame(){
  requestAnimationFrame(frame);
  const now = Date.now();
  const dt = Math.min(0.05, (now - (lastFrame || now)) / 1000);   // cap so a stalled tab
  lastFrame = now;                                                // cannot teleport you
  movePlayer(dt);

  if(PLAYER.spawned){
    const near = nearestNPC();
    if(near !== PLAYER.near){
      PLAYER.near = near;
      const p = $('prompt');
      if(near && !talkOpen){
        p.style.display = 'block';
        p.textContent = `press E to talk to ${AGENTS[near].name}`;
      } else p.style.display = 'none';
    }
    if(talkOpen) $('prompt').style.display = 'none';
  }
  draw();
}

// Split out from the rAF loop so a paint can be forced. A tab opened in the background
// gets no rAF callbacks at all until it is focused, which previously meant an empty canvas
// on arrival; load() now paints one frame directly so the city is there the moment you look.
function draw(){
  if(!MAP || !bg || !AGENTS || !cv.width) return;
  const now = Date.now();
  if(follow && PLAYER.spawned) applyView();      // camera tracks you every frame

  ctx.fillStyle = '#080a0e';
  ctx.fillRect(0,0,cv.width,cv.height);
  ctx.save();
  ctx.translate(view.ox, view.oy);
  ctx.scale(view.s, view.s);
  ctx.drawImage(bg, 0, 0);

  // Night wash — the city visibly changes shift, which sells "time is passing" more
  // cheaply than any clock in the corner.
  const block = ['morning','afternoon','evening','night'][WORLD.beat % 4];
  const wash = {morning:null, afternoon:null,
                evening:'rgba(40,30,80,.28)', night:'rgba(8,10,30,.52)'}[block];
  if(wash){ ctx.fillStyle = wash; ctx.fillRect(0,0,MAP.w*T,MAP.h*T); }

  // Everyone at a location shares its single anchor tile, so four housemates would draw
  // at exactly the same pixel and read as one person. Fan co-located characters onto a
  // small ellipse around the shared tile — sorted by id so the arrangement is stable
  // frame to frame and nobody jitters between positions.
  const R = {};
  for(const id in AGENTS) R[id] = agentRenderPos(id, now);
  const cluster = {};
  for(const id in R){
    const k = Math.round(R[id].x) + ',' + Math.round(R[id].y);
    (cluster[k] = cluster[k] || []).push(id);
  }
  for(const k in cluster){
    const g = cluster[k];
    if(g.length < 2) continue;
    g.sort();
    g.forEach((id, i) => {
      const ang = (i / g.length) * Math.PI * 2;
      R[id].x += Math.cos(ang) * 0.55;
      R[id].y += Math.sin(ang) * 0.38;
    });
  }

  // Text is collected in world coordinates here and drawn after the camera transform is
  // released, so every label renders at native resolution instead of being scaled up with
  // the pixel art.
  const tags = [], bubbles = [];

  const order = Object.keys(R).sort((a,b)=>R[a].y - R[b].y);
  for(const id of order){
    const r = R[id];
    const px = r.x*T + 3, py = r.y*T + 1;
    const frameN = r.moving ? Math.floor(now/140)%2 : 0;

    if(selected===id){
      ctx.fillStyle='rgba(224,180,74,.16)';
      ctx.beginPath(); ctx.arc(px+5, py+8, 13, 0, 7); ctx.fill();
      ctx.strokeStyle='#e0b44a'; ctx.lineWidth=1;
      ctx.strokeRect(px-2.5, py-2.5, 15, 19);
    }
    drawPerson(ctx, px, py, id, frameN, r.facing, 1);

    if(view.s >= 1.1 || selected===id){
      tags.push({wx: r.x + 0.5, wy: r.y - 0.25,
                 text: AGENTS[id].name.split(' ').slice(-1)[0], hot: selected===id});
    }
  }

  if(PLAYER.spawned){
    const px = PLAYER.x*T + 3, py = PLAYER.y*T + 1;
    if(PLAYER.near){                              // halo on whoever is in earshot
      const r = R[PLAYER.near];
      ctx.strokeStyle = 'rgba(224,180,74,.85)'; ctx.lineWidth = 1;
      ctx.strokeRect(r.x*T + 0.5, r.y*T - 2, 15, 19);
    }
    drawPerson(ctx, px, py, '__player', PLAYER.moving ? Math.floor(now/120)%2 : 0,
               PLAYER.facing, 1);
    tags.push({wx: PLAYER.x + 0.5, wy: PLAYER.y - 0.25, text: 'you', you: true});
  }

  for(const id of order){
    const sp = AGENTS[id].speech;
    if(sp && sp.text)
      bubbles.push({wx: R[id].x + 0.5, wy: R[id].y - 0.25, at: AGENTS[id].at,
                    text: sp.text, hot: selected === id});
  }

  ctx.restore();
  drawLabels();
  drawTags(tags);
  drawBubbles(bubbles);
}

function drawTags(tags){
  ctx.save();
  ctx.setTransform(1,0,0,1,0,0);
  ctx.imageSmoothingEnabled = true;
  ctx.textAlign = 'center'; ctx.textBaseline = 'alphabetic';
  const size = Math.max(9, Math.min(12, 8.5 * Math.sqrt(view.s)));
  ctx.font = `500 ${size}px ui-sans-serif, -apple-system, "Segoe UI", system-ui, sans-serif`;
  for(const t of tags){
    const sx = t.wx*T*view.s + view.ox, sy = t.wy*T*view.s + view.oy;
    if(sx < -80 || sx > cv.width+80 || sy < -20 || sy > cv.height+20) continue;
    ctx.lineWidth = 3; ctx.strokeStyle = 'rgba(8,10,14,.85)';
    ctx.strokeText(t.text, sx, sy);                       // halo keeps it legible on any tile
    ctx.fillStyle = t.you ? '#7fd4ff' : t.hot ? '#e0b44a' : 'rgba(214,222,234,.9)';
    ctx.fillText(t.text, sx, sy);
  }
  ctx.restore();
  ctx.imageSmoothingEnabled = false;
}

// Two people in the same room both speak most beats, and the sprite fan-out is only half a
// tile against a ~200px bubble — so stack them per location, newest lowest.
function drawBubbles(bubbles){
  ctx.save();
  ctx.setTransform(1,0,0,1,0,0);
  ctx.imageSmoothingEnabled = true;
  const stack = {};
  for(const b of bubbles){
    const sx = b.wx*T*view.s + view.ox, sy = b.wy*T*view.s + view.oy;
    if(sx < -200 || sx > cv.width+200 || sy < -120 || sy > cv.height+120) continue;
    const lift = stack[b.at] || 0;
    stack[b.at] = lift + drawBubble(ctx, sx, sy - lift - 10, b.text, b.hot) + 5;
  }
  ctx.restore();
  ctx.imageSmoothingEnabled = false;
}

function drawBubble(g, ax, ay, text, hot){
  // Screen space, native resolution: dialogue used to be baked into the scaled pixel-art
  // layer and came out unreadable at anything but full zoom.
  const size = Math.max(10, Math.min(13, 9.5 * Math.sqrt(view.s)));
  const maxW = Math.min(240, cv.width - 24), pad = 7, lh = size * 1.32;
  g.font = `${size}px ui-sans-serif, -apple-system, "Segoe UI", system-ui, sans-serif`;
  g.textAlign = 'left';
  g.textBaseline = 'alphabetic';

  const words = String(text).split(/\s+/), lines = [];
  let cur = '';
  for(const w of words){
    const t = cur ? cur+' '+w : w;
    if(g.measureText(t).width > maxW - pad*2 && cur){ lines.push(cur); cur = w; }
    else cur = t;
  }
  if(cur) lines.push(cur);
  if(lines.length > 3){ lines.length = 3; lines[2] = lines[2].replace(/.{2}$/,'…'); }

  const w = Math.min(maxW, Math.max(...lines.map(l=>g.measureText(l).width)) + pad*2);
  const h = lines.length*lh + pad*2;
  // Keep the bubble on screen — a speaker near the edge had half their line cut off.
  const x = Math.max(4, Math.min(cv.width - w - 4, ax - w/2));
  const y = ay - h;

  g.fillStyle = hot ? 'rgba(232,196,106,.97)' : 'rgba(238,242,248,.97)';
  g.beginPath();
  if(g.roundRect) g.roundRect(x, y, w, h, 5); else g.rect(x, y, w, h);
  g.fill();
  g.beginPath();                                   // tail, still pointing at the speaker
  g.moveTo(ax-4, y+h-1); g.lineTo(ax, y+h+6); g.lineTo(ax+4, y+h-1);
  g.closePath(); g.fill();

  g.fillStyle = '#14171d';
  lines.forEach((l,i)=> g.fillText(l, x+pad, y+pad+lh*(i+0.78)));
  return h;
}
requestAnimationFrame(frame);

// ── picking ─────────────────────────────────────────────────────────────────
cv.addEventListener('click', e=>{
  if(!AGENTS) return;
  if(drag && drag.moved > 4) return;          // a pan is not a selection
  const r = cv.getBoundingClientRect();
  const mx = (e.clientX - r.left - view.ox)/view.s/T;
  const my = (e.clientY - r.top  - view.oy)/view.s/T;
  // Generous when zoomed out (sprites are tiny), tighter when zoomed in and you can
  // actually aim at the person you mean.
  let best=null, bd=Math.max(0.9, 2.2/zoom);
  for(const id in AGENTS){
    const p = agentRenderPos(id, Date.now());
    const d = Math.hypot(p.x+0.5-mx, p.y+0.5-my);
    if(d<bd){ bd=d; best=id; }
  }
  select(best);
});

function select(id){ selected = id; paintPanel(); }

// ── panel ───────────────────────────────────────────────────────────────────
function bar(v, color){
  return `<div class="bar"><i style="width:${clamp(v,0,100)}%;background:${color}"></i></div>`;
}

function paintPanel(){
  if(!WORLD || !AGENTS) return;
  const day = Math.floor(WORLD.beat/4);
  const block = ['morning','afternoon','evening','night'][WORLD.beat%4];
  $('when').textContent = `Day ${day} · ${block}`;
  $('weather').textContent = `· ${WORLD.weather}`;

  const name = id => (ROSTER && ROSTER[id] || {}).name || id;

  // ── right now ─────────────────────────────────────────────────────────────
  const ev = (WORLD.events && WORLD.events[0]) ? WORLD.events[0].text : null;
  const L = $('latest');
  L.textContent = ev || 'A quiet stretch. Nothing anybody would write down.';
  L.className = ev ? 'event' : 'event quiet';

  // One sentence for how the block feels, so you know the temperature without reading five
  // mood bars and doing the arithmetic yourself.
  const liv = Object.values(AGENTS);
  const avg = k => liv.reduce((t,a)=>t+((a.mood||{})[k]||0),0) / Math.max(1,liv.length);
  const stress = avg('stress'), fear = avg('fear'), grief = avg('grief');
  const feel = fear>45 ? 'Everyone is frightened of something.'
             : stress>60 ? 'The block is wound tight.'
             : grief>18 ? 'People are still burying somebody.'
             : stress>40 ? 'Ordinary bad week.'
             : 'It is calm, which nobody trusts.';
  $('mood').textContent = `${liv.length} people. ${feel}`;

  // ── trouble: everything actively going wrong, as sentences ────────────────
  // Debts, feuds and pending charges used to be three separate boxes of figures. They are
  // the same thing from the reader's point of view — who is angry with whom, and why.
  const items = [];

  for(const d of (WORLD.debts||[])){
    if(d.settled) continue;
    const over = day - d.due_day;
    if(over < 0) continue;
    const what = d.kind==='money' ? '$'+(d.amount||0).toLocaleString()
               : d.kind==='favour' ? 'a favour' : 'a package';
    const asked = d.asked ? ` Asked ${d.asked} time${d.asked===1?'':'s'} already.` : '';
    const fedUp = over > (d.patience!=null ? d.patience : 3);
    items.push({p: fedUp ? 3 : 2, sort: over,
      head: `<b>${esc(name(d.to))}</b> is owed ${esc(what)} by <b>${esc(name(d.from))}</b>`,
      sub: `${over} day${over===1?'':'s'} late.${asked}` +
           (fedUp ? ' Out of patience — looking for them.' : '')});
  }

  for(const f of (WORLD.feuds||[])){
    items.push({p:3, sort: f.heat||0,
      head: `<b>${esc(name(f.a))}</b> and <b>${esc(name(f.b))}</b> are feuding`,
      sub: esc(f.cause||'') + ` · since day ${f.since_day}`});
  }

  for(const c of (WORLD.charges||[])){
    if(c.status!=='awaiting_trial') continue;
    items.push({p:3, sort: 999,
      head: `<b>${esc(c.name)}</b> is in a cell awaiting trial`,
      sub: `charged over ${esc(c.law_title||'a local ordinance')}`});
  }

  items.sort((x,y)=> y.p-x.p || y.sort-x.sort);
  $('troublecount').textContent = items.length ? `${items.length}` : '';
  $('trouble').innerHTML = items.length
    ? items.slice(0,8).map(t=>
        `<div class="tr"><div class="pip p${t.p}"></div>
         <div>${t.head}<span class="sub">${t.sub}</span></div></div>`).join('')
    : '<div class="calm">Nobody is owed anything and nobody is fighting. It will not last.</div>';

  // ── the state of the block ────────────────────────────────────────────────
  // Police attention as words. "Riverside 62" required you to know what 62 meant.
  const heatWord = v => v>70 ? ['crawling with police','var(--hot)']
                    : v>45 ? ['being watched closely','var(--hot)']
                    : v>25 ? ['getting attention','var(--gold)']
                    : ['quiet','var(--dim)'];
  // Only name the districts that are actually warm. Listing all four as "quiet" is four
  // lines that say nothing; one sentence says the same thing and reads faster.
  const hot = Object.entries(WORLD.heat||{}).filter(([,v])=>v>25)
                    .sort((a,b)=>b[1]-a[1]);
  const bits = hot.length ? hot.map(([d,v])=>{
    const [word,col] = heatWord(v);
    const nm = (MAP.districts[d]||{}).name || d;
    return `<div class="row"><span>${esc(nm)}</span>
            <span style="color:${col}">${word}</span></div>`;
  }) : ['<div class="calm">Police are not paying much attention to anywhere right now.</div>'];

  const works = Object.values(MAP.locations).filter(b=>b.condition && b.condition!=='standing');
  for(const b of works){
    const label = b.condition==='ruin' ? 'burnt out'
                : b.condition==='rebuilding' ? 'going back up' : 'damaged';
    const col = b.condition==='ruin' ? 'var(--hot)'
              : b.condition==='rebuilding' ? 'var(--gold)' : 'var(--dim)';
    bits.push(`<div class="row"><span>${esc(b.name)}</span>
               <span style="color:${col}">${label}</span></div>`);
  }
  if(DEAD.length){
    const recent = DEAD.slice(0,3).map(d=>esc(d.name)).join(', ');
    bits.push(`<div class="hint" style="padding-top:8px">Buried: ${recent}` +
              (DEAD.length>3 ? ` and ${DEAD.length-3} more.` : '.') + `</div>`);
  }
  $('stateblock').innerHTML = bits.join('');

  // ── the law ───────────────────────────────────────────────────────────────
  const laws = (WORLD.laws||[]).filter(l=>l.status==='enacted');
  $('lawhead').textContent = laws.length ? `THE LAW HERE (${laws.length})` : 'THE LAW HERE';
  $('laws').innerHTML = laws.length ? laws.slice().reverse().slice(0,6).map(l=>{
    const pen = l.penalty||{};
    const p = pen.type==='fine' ? '$'+pen.amount
            : pen.type==='jail' ? pen.amount+' days inside'
            : pen.amount+' days service';
    return `<div class="tr"><div class="pip p1"></div><div><b>${esc(l.title)}</b>
      <span class="sub">${esc(l.text)}</span>
      <span class="sub">${esc(name(l.proposed_by))} pushed for it after ${esc(l.because||'trouble')}
      · ${esc(p)} · ${l.convictions||0} convicted</span></div></div>`;
  }).join('')
   : '<div class="calm">Nothing is written down yet. The block passes a rule when something goes wrong enough.</div>';

  $('casthead').textContent = Object.keys(AGENTS).length + ' PEOPLE';


  const cast = $('cast');
  cast.innerHTML = '';
  for(const id of Object.keys(AGENTS)){
    const a = AGENTS[id];
    const el = document.createElement('div');
    el.className = 'who' + (selected===id?' on':'');
    el.onclick = ()=>select(id);
    el.appendChild(castThumb(id));
    el.insertAdjacentHTML('beforeend',
      `<div class="n">${esc(a.name)}<div class="w">${esc(a.action || a.activity || '')}</div></div>`);
    cast.appendChild(el);
  }

  paintMind();
}

function paintMind(){
  const sec = $('mindsec');
  if(!selected || !AGENTS[selected]){ sec.style.display='none'; return; }
  sec.style.display='';
  const a = AGENTS[selected];
  $('mindname').textContent = a.name.toUpperCase();

  const rels = Object.entries(a.relationships||{})
    .filter(([k])=>AGENTS[k])
    .sort((x,y)=>Math.abs(y[1].affinity)-Math.abs(x[1].affinity))
    .slice(0,5);

  const mems = (a.memories||[]).slice(-6).reverse();

  $('mind').innerHTML = `
    <div style="color:var(--dim);padding-bottom:6px">${esc(a.age)} · ${esc(a.role)}</div>

    <div class="row"><span>energy</span><span>${a.mood.energy}</span></div>${bar(a.mood.energy,'var(--good)')}
    <div class="row"><span>happiness</span><span>${a.mood.happiness}</span></div>${bar(a.mood.happiness,'var(--gold)')}
    <div class="row"><span>stress</span><span>${a.mood.stress}</span></div>${bar(a.mood.stress,'var(--hot)')}
    <div class="row"><span>needs company</span><span>${a.mood.social_need}</span></div>${bar(a.mood.social_need,'var(--cool)')}
    <div class="row"><span>fear</span><span>${a.mood.fear}</span></div>${bar(a.mood.fear,'#9a5fd0')}

    <div style="padding:8px 0 2px;color:var(--dim)">RIGHT NOW</div>
    <div>${esc(a.action || a.activity || '—')}</div>
    <div style="color:var(--dim);font-size:10px">at ${esc((MAP.locations[a.at]||{}).name||a.at)}</div>
    ${a.thought ? `<div class="thought">“${esc(a.thought)}”</div>` : ''}
    ${a.speech ? `<div class="thought">to ${esc((AGENTS[a.speech.to]||{}).name||a.speech.to)}:
        “${esc(a.speech.text)}”</div>` : ''}

    <div style="padding:10px 0 2px;color:var(--dim)">WANTS</div>
    <div>${esc(a.ambition)}</div>
    <div style="padding:8px 0 2px;color:var(--dim)">DREADS</div>
    <div>${esc(a.private_fear)}</div>

    <div style="padding:10px 0 2px;color:var(--dim)">THINKS OF</div>
    ${rels.map(([k,v])=>{
      const c = v.affinity>25?'var(--good)':v.affinity<-25?'var(--hot)':'var(--dim)';
      return `<div class="rel"><span style="color:${c}">${esc(AGENTS[k].name.split(' ').slice(-1)[0])}</span>
              <span class="o">${esc(v.opinion)}</span></div>`;
    }).join('')}

    <div style="padding:10px 0 2px;color:var(--dim)">REMEMBERS</div>
    ${mems.length ? mems.map(m=>
      `<div class="memo"><b>d${m.day}</b> ${esc(m.what)}</div>`).join('')
      : '<div style="color:var(--dim)">Nothing worth keeping yet.</div>'}
  `;
}

function renderTicker(){
  // Dialogue first — a line somebody actually said is far more alive than the weather.
  const said = LOG.filter(r=>r.kind==='act' && r.speech && r.speech.text).slice(-5).reverse()
    .map(r=>`${r.name.split(' ').slice(-1)[0]}: “${r.speech.text}”`);
  const evs = LOG.filter(r=>r.event).slice(-3).reverse().map(r=>`d${r.day}: ${r.event}`);
  const line = said.concat(evs).join('   ·   ');
  $('ticker').textContent = line ||
    `The city has been running since ${WORLD ? WORLD.started_at : '—'}.`;
}

// ── the player ──────────────────────────────────────────────────────────────
// You are not part of the simulation: the cloud has no idea you exist between beats.
// You move locally at whatever framerate the browser manages, and only the things you
// actually say to somebody are sent anywhere.
const PLAYER = {x:31.5, y:24.5, facing:'S', moving:false, spawned:false, near:null};
const SPEED = 5.2;                       // tiles per second
const keys = {};
let follow = false, lastFrame = 0;

addEventListener('keydown', e=>{
  if(['w','a','s','d','arrowup','arrowdown','arrowleft','arrowright'].includes(e.key.toLowerCase())){
    keys[e.key.toLowerCase()] = true;
    if(!PLAYER.spawned){ PLAYER.spawned = true; follow = true; $('controls').style.display='none'; }
    e.preventDefault();
  }
  if(e.key === 'e' || e.key === 'E'){ if(PLAYER.near) openTalk(PLAYER.near); }
  if(e.key === 'Escape') closeTalk();
});
addEventListener('keyup', e=>{ keys[e.key.toLowerCase()] = false; });

function movePlayer(dt){
  if(!PLAYER.spawned || talkOpen) return;
  let dx = (keys.d||keys.arrowright?1:0) - (keys.a||keys.arrowleft?1:0);
  let dy = (keys.s||keys.arrowdown?1:0) - (keys.w||keys.arrowup?1:0);
  PLAYER.moving = !!(dx||dy);
  if(!PLAYER.moving) return;

  const len = Math.hypot(dx,dy) || 1;
  dx = dx/len*SPEED*dt; dy = dy/len*SPEED*dt;
  PLAYER.facing = Math.abs(dx) > Math.abs(dy) ? (dx>0?'E':'W') : (dy>0?'S':'N');

  // Axis-separated so sliding along a wall feels right instead of sticking. Tested
  // against the player's leading EDGE, not their centre: testing the centre let you walk
  // half a tile into a wall before the rounding noticed, so sprites clipped through
  // brickwork.
  const RAD = 0.42;
  const edgeX = Math.round(PLAYER.x + dx + Math.sign(dx)*RAD);
  const edgeY = Math.round(PLAYER.y + dy + Math.sign(dy)*RAD);
  if(dx && walkableAt(edgeX, Math.round(PLAYER.y))) PLAYER.x += dx;
  if(dy && walkableAt(Math.round(PLAYER.x), edgeY)) PLAYER.y += dy;
}

function nearestNPC(){
  if(!AGENTS || !PLAYER.spawned) return null;
  let best=null, bd=1.8;
  for(const id in AGENTS){
    const p = AGENTS[id].pos;
    const d = Math.hypot(p[0]-PLAYER.x, p[1]-PLAYER.y);
    if(d < bd){ bd = d; best = id; }
  }
  return best;
}

// ── talking ─────────────────────────────────────────────────────────────────
let talkOpen = false, talkWith = null;

function openTalk(id){
  talkOpen = true; talkWith = id; selected = id; paintPanel();
  $('talk').style.display = 'flex';
  $('talkWho').textContent = AGENTS[id].name;
  $('talkLog').innerHTML = `<div class="tl-sys">You walk up to ${esc(AGENTS[id].name)}.</div>`;
  $('talkInput').value = '';
  $('talkInput').focus();
}
function closeTalk(){
  talkOpen = false; talkWith = null;
  $('talk').style.display = 'none';
}

async function sendLine(){
  const box = $('talkInput'), line = box.value.trim();
  if(!line || !talkWith) return;
  box.value = ''; box.disabled = true;

  $('talkLog').insertAdjacentHTML('beforeend', `<div class="tl-you">You: ${esc(line)}</div>`);
  $('talkLog').insertAdjacentHTML('beforeend', `<div class="tl-wait" id="tw">…</div>`);
  $('talkLog').scrollTop = 1e6;

  try{
    const r = await fetch(TALK_URL + '/talk', {
      method:'POST',
      headers:{'Content-Type':'application/json','X-Player-Key':playerKey()},
      body: JSON.stringify({agent: talkWith, line}),
    });
    const d = await r.json();
    document.getElementById('tw').remove();
    if(!r.ok) throw new Error(d.error || ('HTTP '+r.status));
    $('talkLog').insertAdjacentHTML('beforeend',
      `<div class="tl-them"><b>${esc(AGENTS[talkWith].name.split(' ').slice(-1)[0])}:</b> ${esc(d.reply)}</div>`);
    $('talkLog').insertAdjacentHTML('beforeend',
      `<div class="tl-sys">They will remember this by the next beat.</div>`);
  }catch(e){
    const w = document.getElementById('tw'); if(w) w.remove();
    $('talkLog').insertAdjacentHTML('beforeend', `<div class="tl-err">${esc(e.message)}</div>`);
  }
  box.disabled = false; box.focus();
  $('talkLog').scrollTop = 1e6;
}

// ── while you were away ─────────────────────────────────────────────────────
// The city runs whether or not anyone is watching, which is only a good feature if
// returning to it tells you what you missed. This is the payoff loop for the whole
// project: not a diff, a front page.

function mdLite(src){
  return src.split('\n').map(l=>{
    l = esc(l.trim());
    if(!l) return '';
    if(l.startsWith('## ')) return `<h2>${l.slice(3)}</h2>`;
    if(l.startsWith('*') && l.endsWith('*') && !l.includes('**'))
      return `<div style="color:var(--dim);font-size:10px">${l.replace(/\*/g,'')}</div>`;
    return '<div>' + l.replace(/\*\*(.+?)\*\*/g, '<b>$1</b>') + '</div>';
  }).join('');
}

async function showAway(){
  const seen = parseInt(localStorage.getItem('cut_last_beat') || '0', 10);
  const now = WORLD.beat;
  // First ever visit establishes a baseline rather than replaying the whole city.
  if(!seen || now <= seen){ localStorage.setItem('cut_last_beat', String(now)); return; }

  const since = LOG.filter(r => r.beat > seen);
  const events  = since.filter(r => r.event).map(r => r.event);
  const said    = since.filter(r => r.kind==='act' && r.speech && r.speech.text)
                       .map(r => `<b>${esc(r.name.split(' ').slice(-1)[0])}:</b> “${esc(r.speech.text)}”`);
  const beliefs = since.filter(r => r.kind==='belief')
                       .map(r => `<b>${esc(r.name.split(' ').slice(-1)[0])}</b> decided: ${esc(r.belief)}`);
  const met     = since.filter(r => r.kind==='player')
                       .map(r => `<b>${esc(r.name.split(' ').slice(-1)[0])}</b> remembers you: “${esc(r.line)}”`);

  if(!events.length && !said.length && !beliefs.length){
    localStorage.setItem('cut_last_beat', String(now));
    return;
  }

  const days = Math.floor(now/4) - Math.floor(seen/4);
  $('awaySub').textContent =
    `· ${now - seen} beat${now-seen===1?'':'s'}` + (days ? ` · ${days} city-day${days===1?'':'s'}` : '');

  let paper = '';
  const day = Math.floor(now/4);
  for(let d = day; d > day - 3 && d >= 0; d--){
    try{
      const r = await fetch(`state/gazette/day-${String(d).padStart(3,'0')}.md?t=${Date.now()}`,
                            {cache:'no-store'});
      if(r.ok){ paper = `<div class="paper">${mdLite(await r.text())}</div>`; break; }
    }catch(e){ /* no paper that day */ }
  }

  // People re-form the same conclusion on consecutive nights, so the same line can appear
  // once per city-day. Fine in the log; repetitive in a summary.
  const grp = (title, items) => {
    const seen = new Set(), uniq = [];
    for(const i of items){ if(!seen.has(i)){ seen.add(i); uniq.push(i); } }
    return uniq.length
      ? `<div class="grp"><h3>${title}</h3>${uniq.slice(-6).map(i=>`<li>${i}</li>`).join('')}</div>`
      : '';
  };

  $('awayBody').innerHTML = paper
    + grp('THEY REMEMBER YOU', met)
    + grp('WHAT HAPPENED', events.map(esc))
    + grp('OVERHEARD', said)
    + grp('CONCLUSIONS DRAWN', beliefs);

  $('away').style.display = 'block';
  $('awayGo').onclick = ()=>{
    $('away').style.display = 'none';
    localStorage.setItem('cut_last_beat', String(WORLD.beat));
  };
}

// Not a secret, and never was: this page is public, so anything it sends is readable by
// anyone who opens devtools. Its only job is to stop the Worker being trivially scripted
// by someone who never looked. The defences that actually matter — per-IP rate limiting,
// an origin allowlist and the content guardrail — live in the Worker, where they cannot be
// read off or edited. Prompting the player for it bought nothing and cost the one thing
// that mattered: being able to just walk up to somebody and talk.
const SITE_KEY = 'fuWBiw8wX0f3';
function playerKey(){ return SITE_KEY; }

// ── go ──────────────────────────────────────────────────────────────────────
$('talkX').onclick = closeTalk;
$('talkSend').onclick = sendLine;
$('talkInput').addEventListener('keydown', e=>{
  e.stopPropagation();                       // WASD in the box must type, not walk
  if(e.key === 'Enter') sendLine();
  if(e.key === 'Escape') closeTalk();
});

load(true);
setInterval(()=>load(false), 60*1000);
document.addEventListener('visibilitychange', ()=>{
  if(!document.hidden && Date.now()-lastFetch > 20000) load(false);
});
