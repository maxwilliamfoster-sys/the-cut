name = "the-cut-talk"
main = "src/index.js"
compatibility_date = "2026-08-01"

# Secrets (set with `npx wrangler secret put <NAME>`, never committed):
#   GROQ_API_KEY  the brain
#   PLAYER_KEY    gate on /talk so a public URL cannot burn the token budget
#   DRAIN_KEY     lets the GitHub Action pull the queue and nobody else

# Cloudflare's own inference, used as the fallback when Groq is out of tokens for the day.
# It needs no key and no account beyond the one already running this Worker, which makes it
# the only fallback that cannot itself be misconfigured.
[ai]
binding = "AI"

# This id exists in the maxwilliamfoster@gmail.com account and nowhere else. Deploying while
# signed into a different Cloudflare account fails with "KV namespace not found [code: 10041]",
# which reads like the storage is gone when really the account is wrong. deploy.cmd checks
# the signed-in account before it tries anything.
[[kv_namespaces]]
binding = "CUT_KV"
id = "ed0402dbd6b84f6383b961cae89f7fe2"

[observability]
enabled = true
